name: Build GPU Screen Recorder with Mic Icon

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      current_version: ${{ steps.version.outputs.current_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq

      - name: Get latest version from Arch packaging repo
        id: version
        run: |
          git clone --depth=1 \
            https://gitlab.archlinux.org/archlinux/packaging/packages/gpu-screen-recorder.git \
            arch-package

          VERSION=$(grep -Po '^pkgver=\K.*' arch-package/PKGBUILD)

          echo "current_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versión actual en Arch: $VERSION"

      - name: Get latest release from GitHub
        id: release
        run: |
          RELEASE_RESPONSE=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" 2>/dev/null || echo '{"tag_name":null}')
          
          LATEST_RELEASE=$(echo "$RELEASE_RESPONSE" | jq -r '.tag_name // ""')
          if [ -n "$LATEST_RELEASE" ] && [ "$LATEST_RELEASE" != "null" ]; then
            LATEST_VERSION=${LATEST_RELEASE#v}
            echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
            echo "Último release en GitHub: $LATEST_VERSION"
          else
            echo "latest_version=" >> $GITHUB_OUTPUT
            echo "No hay releases previos"
          fi

      - name: Check if build needed
        id: check
        run: |
          CURRENT="${{ steps.version.outputs.current_version }}"
          LATEST="${{ steps.release.outputs.latest_version }}"
          
          if [ -z "$LATEST" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "No hay releases previos. Se construirá versión $CURRENT"
          elif [ "$CURRENT" != "$LATEST" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Nueva versión detectada: $CURRENT (anterior: $LATEST)"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Ya está actualizado: $CURRENT"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    outputs:
      version: ${{ steps.version.outputs.version }}  # <-- Agrega esta línea
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            git \
            meson \
            cmake \
            ffmpeg \
            libpulse \
            libva \
            libdrm \
            vulkan-headers \
            libx11 \
            libxcomposite \
            libxrandr \
            libxfixes \
            libxdamage \
            libglvnd \
            libcap \
            wayland \
            libpipewire \
            dbus \
            libjpeg-turbo \
            nlohmann-json \
            python \
            gcc \
            ninja \
            nasm \
            yasm \
            pkgconf \
            python-setuptools
          
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Get current version
        id: version
        run: |
          VERSION="${{ needs.check-version.outputs.current_version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Compilando versión: $VERSION"

      - name: Build package with patch
        run: |
          mkdir -p /home/builder/build
          cd /home/builder/build

          git clone --depth=1 \
            https://gitlab.archlinux.org/archlinux/packaging/packages/gpu-screen-recorder.git \
            packaging

          cd packaging

          echo "Contenido del packaging:"
          ls -la

          # Subir pkgrel para diferenciar nuestro paquete
          sed -i 's/^pkgrel=.*/pkgrel=310/' PKGBUILD

          # Activar ffmpeg estático + x86-64-v3 + permitir wraps
          sed -i \
            's/arch-meson build -Dsystemd=true -Dffmpeg_static=false --buildtype=release -Dstrip=true/arch-meson build -Dsystemd=true -Dffmpeg_static=true --wrap-mode=default -Dc_args="-march=x86-64-v3" -Dcpp_args="-march=x86-64-v3" --buildtype=release -Dstrip=true/' \
            PKGBUILD

          grep arch-meson PKGBUILD

          # Si Arch quitó el .install pero PKGBUILD todavía lo referencia,
          # eliminamos esa referencia
          if grep -q "gpu-screen-recorder.install" PKGBUILD; then
            if [ ! -f gpu-screen-recorder.install ]; then
              echo "El .install no existe, eliminando referencia"
              sed -i '/gpu-screen-recorder\.install/d' PKGBUILD
            fi
          fi


          # Añadir nuestro revert
          printf '%s\n' \
          'prepare() {' \
          '  cd "$srcdir/gpu-screen-recorder"' \
          '' \
          '  echo "Revirtiendo commit ff030ba63f8d109618cbb69d759a5ce4c3cd802f..."' \
          '' \
          '  git revert --no-commit ff030ba63f8d109618cbb69d759a5ce4c3cd802f || echo "El revert falló, continuando..."' \
          '}' \
          >> PKGBUILD

          chown -R builder:builder .

          sudo -u builder makepkg -s --noconfirm

          mkdir -p /tmp/artifacts
          cp *.pkg.tar.zst /tmp/artifacts/

      - name: Create repo database
        run: |
          cd /tmp/artifacts
          
          # Crear la base de datos del repositorio
          repo-add gpu-screen-recorder-mic.db.tar.zst *.pkg.tar.zst
          
          # Crear enlaces simbólicos para compatibilidad
          ln -sf gpu-screen-recorder-mic.db.tar.zst gpu-screen-recorder-mic.db
          ln -sf gpu-screen-recorder-mic.files.tar.zst gpu-screen-recorder-mic.files 2>/dev/null || true
          
          echo "Repositorio creado con éxito"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repo-files
          path: /tmp/artifacts/*
          retention-days: 1

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GPU Screen Recorder v${{ steps.version.outputs.version }} (with mic icon + support older NVIDIA)
          files: /tmp/artifacts/*.pkg.tar.zst
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-repo-branch:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo
          fetch-depth: 1

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: repo-files
          path: ./repo

      - name: Update repo branch
        run: |
          # Configurar git
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # Copiar TODOS los archivos al directorio raíz
          cp -r repo/* .
          rm -rf repo

          if [[ -n $(git status -s) ]]; then
            git add .
            git commit -m "Actualizar repositorio - v${{ needs.build.outputs.version }}"
            git push origin repo
          else
            echo "No hay cambios para commitear"
          fi
